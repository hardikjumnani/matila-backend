# ===========================================================================
# Tooling configuration (formatting & linting).
#
# black  — opinionated code formatter (single source of truth for formatting).
# ruff   — fast linter enforcing PEP8 and common correctness rules.
#
# Both are wired into CI in Step 10. Line length is aligned across tools.
# ===========================================================================

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# DJ: flake8-django, C4: comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "DJ", "C4"]
ignore = [
    "E501",  # Line length is enforced by black, not the linter.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-exports in package initializers are intentional.

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ===========================================================================
# Coverage (measured in CI via `pytest --cov`).
# ===========================================================================
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

