name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # Self-contained test settings (SQLite, in-memory cache/channel layer,
      # eager Celery); external services are mocked, so no infra is needed.
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  test-postgres:
    name: Test on PostgreSQL
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Run the suite against a real PostgreSQL so DB-specific behavior
      # (SKIP LOCKED row locking, JSONField, partial unique indexes, uuid FKs)
      # is validated continuously. Cache/channel layer are in-memory in tests.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/anonymous_chat
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anonymous_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
      - name: Migrate + test on PostgreSQL
        run: |
          python manage.py migrate
          pytest -q
